<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог номеров — Горный воздух</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

    <header class="header">
        <h1 class="header__title">Отель «Горный воздух»</h1>
        <p class="header__subtitle">Каталог номеров</p>
    </header>

    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__item"><a class="nav__link" href="index.html">Главная</a></li>
            <li class="nav__item"><a class="nav__link nav__link--active" href="catalog.html">Каталог номеров</a></li>
            <li class="nav__item"><a class="nav__link" href="detail.html">Номер «Люкс»</a></li>
            <li class="nav__item"><a class="nav__link" href="collection.html">Сравнение номеров</a></li>
            <li class="nav__item"><a class="nav__link" href="checkout.html">Бронирование</a></li>
        </ul>
    </nav>

    <main class="main">
        <h2 class="main__title">Доступные номера</h2>

        <div class="filters">
            <form class="filters__form" action="#" method="get">
                <label class="filters__label" for="date-in">Заезд:</label>
                <input class="filters__input" type="date" id="date-in" name="date_in">
                <label class="filters__label" for="date-out">Выезд:</label>
                <input class="filters__input" type="date" id="date-out" name="date_out">
                <button class="button button--primary" type="submit">Показать</button>
            </form>
        </div>

        <!-- ПУСТОЙ КОНТЕЙНЕР ДЛЯ ДИНАМИЧЕСКОЙ ГЕНЕРАЦИИ КАРТОЧЕК -->
        <section class="catalog" id="catalog-container">
            <!-- Карточки будут генерироваться через JavaScript -->
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">© 2026 Отель «Горный воздух». Все права защищены.</p>
        <p class="footer__text">
            Телефон: <a class="footer__link" href="tel:+78001234567">+7 (800) 123-45-67</a>
        </p>
    </footer>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТА С АТРИБУТОМ DEFER -->
    <script src="js/main.js" defer></script>

</body>
</html>
