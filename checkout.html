<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Горный воздух</title>
</head>
<body>

    <header>
        <h1>Отель «Горный воздух»</h1>
        <p>Бронирование номера</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html">Каталог номеров</a></li>
            <li><a href="detail.html">Номер «Люкс»</a></li>
            <li><a href="collection.html">Сравнение номеров</a></li>
            <li><a href="checkout.html">Бронирование</a></li>
        </ul>
    </nav>

    <main>
        <h2>Ввод данных гостей</h2>

        <section>
            <form action="#" method="post">

                <p>
                    <label for="room-type">Категория номера:</label><br>
                    <select id="room-type" name="room_type" required>
                        <option value="">— выберите номер —</option>
                        <option value="standard">Стандарт</option>
                        <option value="comfort">Комфорт</option>
                        <option value="family">Семейный</option>
                        <option value="lux">Люкс</option>
                    </select>
                </p>

                <p>
                    <label for="adults">Количество взрослых:</label><br>
                    <input type="number" id="adults" name="adults"
                           min="1" max="6" value="2" required>
                </p>

                <p>
                    <label for="children">Количество детей:</label><br>
                    <input type="number" id="children" name="children"
                           min="0" max="4" value="0">
                </p>

                <p>
                    <label for="checkin">Дата заезда:</label><br>
                    <input type="date" id="checkin" name="checkin" required>
                </p>

                <p>
                    <label for="checkout">Дата выезда:</label><br>
                    <input type="date" id="checkout" name="checkout" required>
                </p>

                <p>
                    <label for="promo">Промокод (необязательно):</label><br>
                    <input type="text" id="promo" name="promo"
                           pattern="[A-Za-z0-9]{4,12}"
                           title="4–12 латинских букв или цифр">
                </p>

                <p>
                    <label for="email">Email для подтверждения:</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" required>
                </p>

                <p>
                    <label for="phone">Контактный телефон:</label><br>
                    <input type="tel" id="phone" name="phone"
                           pattern="\+7[0-9]{10}"
                           placeholder="+7XXXXXXXXXX"
                           title="Формат: +7 и 10 цифр" required>
                </p>

                <fieldset>
                    <legend>Способ оплаты:</legend>
                    <p>
                        <input type="radio" id="pay-card" name="payment" value="card" checked>
                        <label for="pay-card">Банковская карта</label>
                    </p>
                    <p>
                        <input type="radio" id="pay-cash" name="payment" value="cash">
                        <label for="pay-cash">Наличные при заселении</label>
                    </p>
                    <p>
                        <input type="radio" id="pay-online" name="payment" value="online">
                        <label for="pay-online">Онлайн-перевод</label>
                    </p>
                </fieldset>

                <p>
                    <input type="checkbox" id="breakfast" name="breakfast" value="yes" checked>
                    <label for="breakfast">Нужен завтрак в номер</label>
                </p>
                <p>
                    <input type="checkbox" id="agree" name="agree" value="yes" required>
                    <label for="agree">Согласен с правилами бронирования</label>
                </p>

                <p>
                    <label for="comment">Комментарий к бронированию:</label><br>
                    <textarea id="comment" name="comment" rows="4" cols="40"
                              placeholder="Например: поздний заезд, детская кроватка..."></textarea>
                </p>

                <p>
                    <button type="submit">Забронировать</button>
                    <button type="reset">Очистить</button>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Отель «Горный воздух». Все права защищены.</p>
        <p>Телефон: <a href="tel:+79625396668">+7 (962) 539-66-68</a></p>
    </footer>

</body>
</html>
