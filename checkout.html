<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Горный воздух</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

    <header class="header">
        <h1 class="header__title">Отель «Горный воздух»</h1>
        <p class="header__subtitle">Бронирование номера</p>
    </header>

    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__item"><a class="nav__link" href="index.html">Главная</a></li>
            <li class="nav__item"><a class="nav__link" href="catalog.html">Каталог номеров</a></li>
            <li class="nav__item"><a class="nav__link" href="detail.html">Номер «Люкс»</a></li>
            <li class="nav__item"><a class="nav__link" href="collection.html">Сравнение номеров</a></li>
            <li class="nav__item"><a class="nav__link nav__link--active" href="checkout.html">Бронирование</a></li>
        </ul>
    </nav>

    <main class="main">
        <h2 class="main__title">Ввод данных гостей</h2>

        <section class="section">
            <form class="form" action="#" method="post">

                <div class="form__group">
                    <label class="form__label" for="room-type">Категория номера:</label>
                    <select class="form__select" id="room-type" name="room_type" required>
                        <option value="">— выберите номер —</option>
                        <option value="standard">Стандарт</option>
                        <option value="comfort">Комфорт</option>
                        <option value="family">Семейный</option>
                        <option value="lux">Люкс</option>
                    </select>
                </div>

                <div class="form__group">
                    <label class="form__label" for="adults">Количество взрослых:</label>
                    <input class="form__input" type="number" id="adults" name="adults"
                           min="1" max="6" value="2" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="children">Количество детей:</label>
                    <input class="form__input" type="number" id="children" name="children"
                           min="0" max="4" value="0">
                </div>

                <div class="form__group">
                    <label class="form__label" for="checkin">Дата заезда:</label>
                    <input class="form__input" type="date" id="checkin" name="checkin" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="checkout">Дата выезда:</label>
                    <input class="form__input" type="date" id="checkout" name="checkout" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="promo">Промокод (необязательно):</label>
                    <input class="form__input" type="text" id="promo" name="promo"
                           pattern="[A-Za-z0-9]{4,12}"
                           title="4–12 латинских букв или цифр">
                </div>

                <div class="form__group">
                    <label class="form__label" for="email">Email для подтверждения:</label>
                    <input class="form__input" type="email" id="email" name="email"
                           placeholder="you@example.com" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="phone">Контактный телефон:</label>
                    <input class="form__input" type="tel" id="phone" name="phone"
                           pattern="\+7[0-9]{10}"
                           placeholder="+7XXXXXXXXXX"
                           title="Формат: +7 и 10 цифр" required>
                </div>

                <fieldset class="form__fieldset">
                    <legend class="form__legend">Способ оплаты:</legend>
                    <div class="form__radio-group">
                        <input class="form__radio" type="radio" id="pay-card" name="payment" value="card" checked>
                        <label class="form__radio-label" for="pay-card">Банковская карта</label>
                    </div>
                    <div class="form__radio-group">
                        <input class="form__radio" type="radio" id="pay-cash" name="payment" value="cash">
                        <label class="form__radio-label" for="pay-cash">Наличные при заселении</label>
                    </div>
                    <div class="form__radio-group">
                        <input class="form__radio" type="radio" id="pay-online" name="payment" value="online">
                        <label class="form__radio-label" for="pay-online">Онлайн-перевод</label>
                    </div>
                </fieldset>

                <div class="form__group form__group--checkbox">
                    <input class="form__checkbox" type="checkbox" id="breakfast" name="breakfast" value="yes" checked>
                    <label class="form__checkbox-label" for="breakfast">Нужен завтрак в номер</label>
                </div>
                <div class="form__group form__group--checkbox">
                    <input class="form__checkbox" type="checkbox" id="agree" name="agree" value="yes" required>
                    <label class="form__checkbox-label" for="agree">Согласен с правилами бронирования</label>
                </div>

                <div class="form__group">
                    <label class="form__label" for="comment">Комментарий к бронированию:</label>
                    <textarea class="form__textarea" id="comment" name="comment" rows="4"
                              placeholder="Например: поздний заезд, детская кроватка..."></textarea>
                </div>

                <div class="form__actions">
                    <button class="button button--primary" type="submit">Забронировать</button>
                    <button class="button button--secondary" type="reset">Очистить</button>
                </div>

            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">© 2026 Отель «Горный воздух». Все права защищены.</p>
        <p class="footer__text">
            Телефон: <a class="footer__link" href="tel:+78001234567">+7 (800) 123-45-67</a>
        </p>
    </footer>

</body>
</html>
